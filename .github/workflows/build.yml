name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties requires Amazon Corretto 21 for the daemon.
      # JDK 17 is also installed for the project's jvmToolchain(17) compile target.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            21
            17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # API 37 is published as android-37.0 (not android-37). `tools` is obsolete.
          packages: platform-tools platforms;android-37.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace --no-daemon
