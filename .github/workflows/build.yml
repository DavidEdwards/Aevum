name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install 17 first, then 21 so JAVA_HOME ends up as Corretto 21
      # (matches gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # API 37 is published as android-37.0 (not android-37). `tools` is obsolete.
          packages: platform-tools platforms;android-37.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: |
          # Daemon JVM criteria require Amazon Corretto 21; register both JDKs for toolchain detection.
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          ./gradlew compileDebugKotlin --stacktrace --no-daemon \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_21_X64
