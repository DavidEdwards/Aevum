name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` is obsolete and fails on current cmdline-tools; AGP fetches build-tools.
          packages: platform-tools platforms;android-37

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace --no-daemon
